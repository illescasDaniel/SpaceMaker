[project]
name = "spacemaker"
version = "1.0.0"
description = "Local backup, convert, and gallery for phone media"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daniel Illescas Romero", email = "contact@daniel-ir.eu" }]
dependencies = [
	"adbutils>=2.12.0",
	"fastapi>=0.141.1",
	"python-multipart>=0.0.20",
	"httpx>=0.28",
	"httpx2>=2.13.0",
	"pydantic>=2.13.5",
	"pyqt6>=6.11.0; sys_platform == 'linux'",
	"pyqt6-webengine>=6.11.0; sys_platform == 'linux'",
	"pywebview>=6.2.1",
	"segno>=1.6.1",
	"qtpy>=2.4.3; sys_platform == 'linux'",
	"uvicorn>=0.53.0",
	"websockets>=17.1",
]

[project.scripts]
spacemaker = "spacemaker.desktop:main"

[dependency-groups]
dev = [
	"mcp>=2.2.0",
	"mkdocs>=1.6.1",
	"mkdocs-material>=9.7.7",
	"pyinstaller>=6.19",
	"pytest>=9.1",
	"pytest-cov>=7.1",
	"pytest-timeout>=2.4",
	"pytest-xdist>=3.6",
	"ruff>=0.15",
	"taskipy>=1.14",
	"ty>=0.0.75",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
filterwarnings = [
	"ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
pythonpath = ["."]
timeout = 60
timeout_method = "thread"
markers = [
	"unit: fast isolated tests",
	"integration: adapter tests with mocked subprocess",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "I", "E", "S", "B"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S603", "S607"]
"tests/**" = ["S101", "S603"]
"src/spacemaker/adapters/outbound/**" = ["S603", "S607"]
"src/spacemaker/desktop.py" = ["S104"]
"src/spacemaker/bootstrap/services.py" = ["S104"]
"src/spacemaker/bootstrap/firewall.py" = ["S603", "S607", "S104"]
"scripts/firewall/**" = ["S603", "S607"]

[tool.ty.environment]
python-version = "3.11"
python = ".venv"
python-platform = "all"
root = ["./src", "."]

[tool.ty.src]
exclude = ["scripts/**", "wireframes/**"]

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
call-non-callable = "ignore"
missing-argument = "ignore"

# qtpy/PyQt6 are sys_platform == 'linux'-only dependencies (see [project.dependencies]
# above) — not installed on this dev machine's venv, so ty can't resolve these imports
# even though they're all behind runtime platform guards. Scoped to exactly the files
# that import them, not a blanket ignore.
[[tool.ty.overrides]]
include = [
	"src/spacemaker/desktop.py",
	"src/spacemaker/adapters/inbound/qt_webengine_shutdown.py",
	"src/spacemaker/adapters/inbound/qt_native_style.py",
	"tests/unit/test_qt_webengine_shutdown.py",
	"packaging/linux-appimage/smoke_webengine.py",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.taskipy.tasks]
sync-dev = { cmd = "uv sync --group dev", help = "install Python dev dependencies" }
checks = { cmd = "python scripts/quality/checks.py", help = "quality gate (pass flags after --)" }
format = { cmd = "uv run ruff check --fix src tests && uv run ruff format src tests", help = "format Python" }
spacemaker = { cmd = "uv run spacemaker", help = "launch SpaceMaker desktop (pywebview + server)" }
spacemaker-server = { cmd = "uv run spacemaker --server-only", help = "run API/UI in browser only" }
smoke = { cmd = "uv run pytest tests/integration/test_server_smoke.py -v", help = "boot the real spacemaker process and verify it doesn't crash on startup (catches uvicorn/asyncio wiring bugs TestClient-based tests can't see)" }
firewall-allow = { cmd = "bash scripts/firewall/allow-spacemaker-port.sh", help = "allow LAN gallery port in ufw/firewalld (run with sudo)" }
build-installer = { cmd = "bash scripts/packaging/build_installer.sh", help = "Linux: pruned AppDir in dist/; other OS: PyInstaller onefile" }
build-appimage = { cmd = "bash scripts/packaging/build_appimage.sh", help = "Linux AppImage (pruned AppDir + zstd squashfs) in dist/" }
readme-screenshot = { cmd = "uv run python scripts/packaging/capture_readme_home_screenshot.py", help = "capture Home hub PNG for README" }
docs-serve = { cmd = "uv run mkdocs serve", help = "serve the docs/ knowledge base at http://127.0.0.1:8000 (live-reloads on edit)" }
docs-build = { cmd = "uv run mkdocs build", help = "static-build the docs site into site/ (also surfaces broken internal links)" }
