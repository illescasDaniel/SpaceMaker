[project]
name = "mcp-nav-shared"
version = "0.1.0"
description = "Shared helpers (LSP client, symbol resolution, formatting, workspace-root discovery) for the codenav/webnav MCP servers"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "_shared"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
