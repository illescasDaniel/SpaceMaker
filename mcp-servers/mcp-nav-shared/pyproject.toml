[project]
name = "mcp-nav-shared"
version = "0.1.0"
description = "Shared helpers (LSP client, symbol resolution, formatting, workspace-root discovery) for the codenav/webnav MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "lsp", "language-server", "code-navigation"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development",
	"Typing :: Typed",
]
authors = [{ name = "Daniel Illescas Romero", email = "contact@daniel-ir.eu" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/illescasDaniel/SpaceMaker/tree/main/mcp-servers/mcp-nav-shared"
Repository = "https://github.com/illescasDaniel/SpaceMaker"
Issues = "https://github.com/illescasDaniel/SpaceMaker/issues"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
