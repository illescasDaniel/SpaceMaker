[project]
name = "mcp-nav-shared"
version = "0.1.0"
description = "Shared helpers (LSP client, symbol resolution, formatting, workspace-root discovery) for the codenav/webnav MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daniel Illescas Romero", email = "contact@daniel-ir.eu" }]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
