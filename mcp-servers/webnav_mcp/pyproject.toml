[project]
name = "webnav-mcp"
version = "0.1.0"
description = "MCP server exposing JS/HTML/CSS language-server features plus a workspace-wide CSS custom-property/selector index as MCP tools"
requires-python = ">=3.11"
dependencies = [
	"mcp>=2.2.0",
	"mcp-nav-shared",
]

[tool.uv.sources]
mcp-nav-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
