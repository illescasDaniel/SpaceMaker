[project]
name = "codenav-mcp"
version = "0.1.0"
description = "MCP server exposing ty's language-server features (hover, definition, references, workspace symbol search, diagnostics) as MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "ty", "lsp", "python", "code-navigation", "ai-agents"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development",
]
authors = [{ name = "Daniel Illescas Romero", email = "contact@daniel-ir.eu" }]
dependencies = [
	"mcp>=2.2.0",
	"ty>=0.0.75",
	"mcp-nav-shared>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/illescasDaniel/SpaceMaker/tree/main/mcp-servers/codenav_mcp"
Repository = "https://github.com/illescasDaniel/SpaceMaker"
Issues = "https://github.com/illescasDaniel/SpaceMaker/issues"

[project.scripts]
codenav-mcp = "codenav_mcp.server:main"

[tool.uv.sources]
mcp-nav-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
markers = [
	"integration: live language-server smoke test",
]
