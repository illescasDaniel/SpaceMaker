name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Install Qt / WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2

      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run task build-appimage

      - name: Smoke test AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./packaging/linux-appimage/smoke-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacemaker-linux-${{ github.sha }}
          path: |
            dist/SpaceMaker-*-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Build and smoke test SpaceMaker.exe
        run: bash scripts/packaging/build_installer.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacemaker-windows-${{ github.sha }}
          path: dist/SpaceMaker.exe
          if-no-files-found: error
          retention-days: 90

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Build and smoke test DMG
        run: uv run task build-macos-dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacemaker-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/SpaceMaker-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spacemaker-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Write combined SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum SpaceMaker* >SHA256SUMS
          cat SHA256SUMS

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/SpaceMaker-*-x86_64.AppImage
            dist/SpaceMaker.exe
            dist/SpaceMaker-*-arm64.dmg
            dist/SpaceMaker-*-x86_64.dmg
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
