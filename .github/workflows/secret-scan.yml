name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smart-commit-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # No decision model in CI: rule hits (keys, tokens, .env and key files) block; ambiguous candidates only warn.
      # This is the backstop for `git commit --no-verify` and for SKIP_SECRET_GUARD=1 (CI ignores the bypass).
      - name: Scan the pull request's added lines
        if: github.event_name == 'pull_request'
        run: uvx --from 'smart-commit-guard>=0.3,<0.4' smart-commit-guard scan --no-model --diff "origin/${{ github.base_ref }}...HEAD" --messages

      - name: Scan the whole tree
        if: github.event_name == 'push'
        run: uvx --from 'smart-commit-guard>=0.3,<0.4' smart-commit-guard scan --no-model --all
